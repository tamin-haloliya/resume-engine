services:
  postgres:
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # Best practice: append /data for Postgres

  redis:
    image: redis:8-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - cache:/data

volumes:
  pgdata:
  cache:
